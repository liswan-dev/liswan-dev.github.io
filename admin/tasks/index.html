<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem('liswan-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tasks — Admin — Liswan.dev</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#032E66">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body class="dash-body">
<div class="dash-sidebar-backdrop" data-sidebar-backdrop></div>
<div class="dash-shell">
  <aside class="dash-sidebar"></aside>
  <div>
    <header class="dash-topbar">
      <button class="dash-hamburger" data-sidebar-toggle aria-label="Toggle menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="dash-breadcrumb"><a href="/admin/">Admin</a><span>/</span><span>Tasks</span></div>
      <div class="dash-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="Search tasks..."></div>
      <div class="dash-topbar-actions">
        <button class="dash-icon-btn" id="theme-toggle" aria-label="Toggle theme"></button>
        <button class="dash-icon-btn" id="notif-bell" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dash-notif-dot" id="notif-dot" hidden></span></button>
        <div class="dash-dropdown" id="notif-dropdown"></div>
        <button class="dash-profile-btn" id="profile-btn"><span class="dash-avatar" id="profile-avatar"></span><span id="profile-name"></span></button>
        <div class="dash-dropdown" id="profile-dropdown">
          <div class="dash-dropdown-head"><strong id="profile-name-2"></strong><span id="profile-email"></span></div>
          <a href="/admin/settings/" class="dash-dropdown-item">Settings</a>
          <button type="button" class="dash-dropdown-item" id="logout-btn">Log out</button>
        </div>
      </div>
    </header>
    <main class="dash-main">
      <div class="dash-page-head dash-flex-between">
        <div>
          <h1>Tasks</h1>
          <p>A lightweight internal task list — not visible to clients.</p>
        </div>
        <button class="btn btn-primary" id="new-task-btn">+ New Task</button>
      </div>

      <div class="dash-table-wrap">
        <div class="dash-table-scroll">
          <table class="dash-table">
            <thead>
              <tr><th>Task</th><th>Project</th><th>Status</th><th>Due Date</th></tr>
            </thead>
            <tbody id="tasks-tbody">
              <tr><td colspan="4"><div class="skeleton" style="height:20px"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modal-new-task">
  <div class="modal-box">
    <div class="modal-header"><h3>New Task</h3><button class="modal-close" data-modal-close="modal-new-task">&times;</button></div>
    <form id="new-task-form">
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-field">
            <label class="form-label" for="t-project">Project</label>
            <select id="t-project" class="form-select" required></select>
          </div>
          <div class="form-field">
            <label class="form-label" for="t-title">Title</label>
            <input type="text" id="t-title" class="form-input" required>
          </div>
          <div class="form-grid cols-2">
            <div class="form-field">
              <label class="form-label" for="t-status">Status</label>
              <select id="t-status" class="form-select">
                <option value="todo">To Do</option>
                <option value="in_progress">In Progress</option>
                <option value="done">Done</option>
              </select>
            </div>
            <div class="form-field">
              <label class="form-label" for="t-due">Due Date</label>
              <input type="date" id="t-due" class="form-input">
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-modal-close="modal-new-task">Cancel</button>
        <button type="submit" class="btn btn-primary">Create Task</button>
      </div>
    </form>
  </div>
</div>

<div class="toast-stack" id="toast-stack"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-config.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/dummy-data.js"></script>
<script src="/assets/js/data-layer.js"></script>
<script src="/assets/js/dashboard.js"></script>
<script>
/*
 * NOTE: `project_tasks` has no DB.* wrapper in data-layer.js (the client portal
 * never needs it), so this page reads/writes the raw store directly:
 *  - demo mode: localStorage['liswan-demo-db'].project_tasks
 *  - live mode: window.sb.from('project_tasks')
 * This mirrors the same shape/pattern the rest of the app already uses.
 */
document.addEventListener('DOMContentLoaded', async () => {
  const session = Dash.initShell({role:'admin'});
  if (!session) return;

  const STORE_KEY = 'liswan-demo-db';
  const STATUS_LABEL = { todo: 'To Do', in_progress: 'In Progress', done: 'Done' };
  const STATUS_PILL = { todo: 'status-neutral', in_progress: 'status-info', done: 'status-success' };

  let projects = [];

  function loadTasks() {
    if (window.isLiveBackend) return null; // handled async separately
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return [];
    try { return JSON.parse(raw).project_tasks || []; } catch (e) { return []; }
  }

  function saveTasks(tasks) {
    const raw = localStorage.getItem(STORE_KEY);
    const store = raw ? JSON.parse(raw) : {};
    store.project_tasks = tasks;
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  }

  async function getTasks() {
    if (window.isLiveBackend) {
      const r = await window.sb.from('project_tasks').select('*');
      return r.data || [];
    }
    return loadTasks();
  }

  async function renderTasks() {
    projects = await DB.listAllProjects();
    const tasks = await getTasks();
    const tbody = document.getElementById('tasks-tbody');
    if (!tasks.length) {
      tbody.innerHTML = '<tr><td colspan="4"><div class="empty-state"><strong>No tasks yet</strong><p>This is a lightweight internal task list — add one with "+ New Task".</p></div></td></tr>';
      return;
    }
    tbody.innerHTML = tasks.map(t => {
      const project = projects.find(p => p.id === t.project_id);
      return `<tr data-search-row>
        <td>${Dash.escapeHtml(t.title)}</td>
        <td>${Dash.escapeHtml(project ? project.name : '-')}</td>
        <td><span class="status-pill ${STATUS_PILL[t.status] || 'status-neutral'}">${STATUS_LABEL[t.status] || t.status}</span></td>
        <td>${t.due_date ? Dash.formatDate(t.due_date) : '-'}</td>
      </tr>`;
    }).join('');
  }

  document.getElementById('new-task-btn').addEventListener('click', () => {
    document.getElementById('t-project').innerHTML = projects.map(p => `<option value="${p.id}">${Dash.escapeHtml(p.name)}</option>`).join('');
    Dash.openModal('modal-new-task');
  });

  document.getElementById('new-task-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      project_id: document.getElementById('t-project').value,
      title: document.getElementById('t-title').value.trim(),
      status: document.getElementById('t-status').value,
      due_date: document.getElementById('t-due').value || null
    };
    if (window.isLiveBackend) {
      await window.sb.from('project_tasks').insert(payload);
    } else {
      const tasks = loadTasks();
      tasks.push(Object.assign({ id: 'task-' + Math.random().toString(36).slice(2, 10), created_at: new Date().toISOString() }, payload));
      saveTasks(tasks);
    }
    Dash.closeModal('modal-new-task');
    e.target.reset();
    Dash.toast('Task created', 'success');
    await renderTasks();
  });

  await renderTasks();
});
</script>
</body>
</html>
