<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem('liswan-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings — Admin — Liswan.dev</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#032E66">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body class="dash-body">
<div class="dash-sidebar-backdrop" data-sidebar-backdrop></div>
<div class="dash-shell">
  <aside class="dash-sidebar"></aside>
  <div>
    <header class="dash-topbar">
      <button class="dash-hamburger" data-sidebar-toggle aria-label="Toggle menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="dash-breadcrumb"><a href="/admin/">Admin</a><span>/</span><span>Settings</span></div>
      <div class="dash-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="Search..."></div>
      <div class="dash-topbar-actions">
        <button class="dash-icon-btn" id="theme-toggle" aria-label="Toggle theme"></button>
        <button class="dash-icon-btn" id="notif-bell" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dash-notif-dot" id="notif-dot" hidden></span></button>
        <div class="dash-dropdown" id="notif-dropdown"></div>
        <button class="dash-profile-btn" id="profile-btn"><span class="dash-avatar" id="profile-avatar"></span><span id="profile-name"></span></button>
        <div class="dash-dropdown" id="profile-dropdown">
          <div class="dash-dropdown-head"><strong id="profile-name-2"></strong><span id="profile-email"></span></div>
          <a href="/admin/settings/" class="dash-dropdown-item">Settings</a>
          <button type="button" class="dash-dropdown-item" id="logout-btn">Log out</button>
        </div>
      </div>
    </header>
    <main class="dash-main">
      <div class="dash-page-head">
        <h1>Settings</h1>
        <p>Your admin profile and backend connection status.</p>
      </div>

      <div class="dash-grid cols-2">
        <div class="dash-card">
          <div class="dash-section-title">Profile</div>
          <div id="profile-info" style="display:flex;align-items:center;gap:14px">
            <div class="skeleton" style="width:52px;height:52px;border-radius:999px"></div>
            <div class="skeleton" style="width:160px;height:16px"></div>
          </div>
        </div>
        <div class="dash-card">
          <div class="dash-section-title">Backend Status</div>
          <div id="backend-status"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="toast-stack" id="toast-stack"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-config.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/dummy-data.js"></script>
<script src="/assets/js/data-layer.js"></script>
<script src="/assets/js/dashboard.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const session = Dash.initShell({role:'admin'});
  if (!session) return;

  const users = await DB.listAllUsers();
  const me = users.find(u => u.id === session.userId) || { full_name: session.fullName, email: session.email, phone: '' };

  document.getElementById('profile-info').innerHTML = `
    <span class="dash-avatar" style="width:52px;height:52px;font-size:16px">${Dash.initials(me.full_name)}</span>
    <div>
      <div style="font-weight:700;font-size:15px">${Dash.escapeHtml(me.full_name)}</div>
      <div class="dash-muted" style="font-size:13px">${Dash.escapeHtml(me.email)}</div>
      ${me.phone ? `<div class="dash-muted" style="font-size:12.5px">${Dash.escapeHtml(me.phone)}</div>` : ''}
      <div style="margin-top:6px"><span class="status-pill status-progress">Admin</span></div>
    </div>
  `;

  const isLive = !!window.isLiveBackend;
  document.getElementById('backend-status').innerHTML = `
    <div class="dash-flex-between" style="margin-bottom:10px">
      <span class="dash-muted">Mode</span>
      <span class="status-pill ${isLive ? 'status-success' : 'status-warning'}">${isLive ? 'Live (Supabase)' : 'Demo mode'}</span>
    </div>
    <p style="font-size:13px;line-height:1.7;color:var(--muted)">
      ${isLive
        ? 'Connected to Supabase — all reads and writes on this panel affect the live database.'
        : 'Running on localStorage-backed dummy data. Configure <code>assets/js/supabase-config.js</code> with your Supabase URL and anon key to go live.'}
    </p>
  `;
});
</script>
</body>
</html>
