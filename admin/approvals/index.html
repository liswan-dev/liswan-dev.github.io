<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem('liswan-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Approvals — Admin — Liswan.dev</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#032E66">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body class="dash-body">
<div class="dash-sidebar-backdrop" data-sidebar-backdrop></div>
<div class="dash-shell">
  <aside class="dash-sidebar"></aside>
  <div>
    <header class="dash-topbar">
      <button class="dash-hamburger" data-sidebar-toggle aria-label="Toggle menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="dash-breadcrumb"><a href="/admin/">Admin</a><span>/</span><span>Approvals</span></div>
      <div class="dash-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="Search approvals..."></div>
      <div class="dash-topbar-actions">
        <button class="dash-icon-btn" id="theme-toggle" aria-label="Toggle theme"></button>
        <button class="dash-icon-btn" id="notif-bell" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dash-notif-dot" id="notif-dot" hidden></span></button>
        <div class="dash-dropdown" id="notif-dropdown"></div>
        <button class="dash-profile-btn" id="profile-btn"><span class="dash-avatar" id="profile-avatar"></span><span id="profile-name"></span></button>
        <div class="dash-dropdown" id="profile-dropdown">
          <div class="dash-dropdown-head"><strong id="profile-name-2"></strong><span id="profile-email"></span></div>
          <a href="/admin/settings/" class="dash-dropdown-item">Settings</a>
          <button type="button" class="dash-dropdown-item" id="logout-btn">Log out</button>
        </div>
      </div>
    </header>
    <main class="dash-main">
      <div class="dash-page-head">
        <h1>Approvals</h1>
        <p>Approval requests sent to clients. Only the client can approve or request revisions — this view is for visibility, plus a quick way to send a new request.</p>
      </div>

      <div class="dash-table-wrap">
        <div class="dash-table-scroll">
          <table class="dash-table">
            <thead>
              <tr><th>Project</th><th>Title</th><th>Submitted</th><th>Status</th><th>Decided</th></tr>
            </thead>
            <tbody id="approvals-tbody">
              <tr><td colspan="5"><div class="skeleton" style="height:20px"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="dash-card" style="margin-top:22px">
        <div class="dash-section-title">Request New Approval</div>
        <form id="new-approval-form" class="form-grid cols-2" style="align-items:end">
          <div class="form-field">
            <label class="form-label" for="na-project">Project</label>
            <select id="na-project" class="form-select" required></select>
          </div>
          <div class="form-field">
            <label class="form-label" for="na-title">Title</label>
            <input type="text" id="na-title" class="form-input" placeholder="e.g. Homepage Design — Version 2" required>
          </div>
          <button type="submit" class="btn btn-primary">Request Approval</button>
        </form>
      </div>
    </main>
  </div>
</div>

<div class="toast-stack" id="toast-stack"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-config.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/dummy-data.js"></script>
<script src="/assets/js/data-layer.js"></script>
<script src="/assets/js/dashboard.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const session = Dash.initShell({role:'admin'});
  if (!session) return;

  const STATUS_PILL = { pending: 'status-warning', approved: 'status-success', revision_requested: 'status-danger' };
  let projects = [];

  async function renderApprovals() {
    projects = await DB.listAllProjects();
    let rows = [];
    for (const p of projects) {
      const approvals = await DB.listProjectApprovals(p.id);
      approvals.forEach(a => rows.push(Object.assign({}, a, { projectName: p.name })));
    }
    rows.sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));

    const tbody = document.getElementById('approvals-tbody');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><strong>No approvals yet</strong><p>Request one from the form below.</p></div></td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(a => `<tr data-search-row>
      <td>${Dash.escapeHtml(a.projectName)}</td>
      <td>${Dash.escapeHtml(a.title)}</td>
      <td>${Dash.formatDate(a.submitted_at)}</td>
      <td><span class="status-pill ${STATUS_PILL[a.status] || 'status-neutral'}">${a.status.replace('_',' ')}</span>${a.status === 'pending' ? ' <span class="dash-muted" style="font-size:11.5px">— awaiting client response</span>' : ''}</td>
      <td>${a.decided_at ? Dash.formatDate(a.decided_at) : '-'}</td>
    </tr>`).join('');

    document.getElementById('na-project').innerHTML = projects.map(p => `<option value="${p.id}">${Dash.escapeHtml(p.name)}</option>`).join('');
  }

  document.getElementById('new-approval-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const projectId = document.getElementById('na-project').value;
    const title = document.getElementById('na-title').value.trim();
    if (!projectId || !title) return;
    await DB.createApproval(projectId, title);
    document.getElementById('na-title').value = '';
    Dash.toast('Approval requested', 'success');
    await renderApprovals();
  });

  await renderApprovals();
});
</script>
</body>
</html>
