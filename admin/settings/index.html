<script>
document.addEventListener('DOMContentLoaded', async () => {
  const session = Dash.initShell({role:'admin'});
  if (!session) return;

  const users = await DB.listAllUsers();
  const me = users.find(u => u.id === session.userId) || { full_name: session.fullName, email: session.email, phone: '' };

  document.getElementById('profile-info').innerHTML = `
    <span class="dash-avatar" style="width:52px;height:52px;font-size:16px">${Dash.initials(me.full_name)}</span>
    <div>
      <div style="font-weight:700;font-size:15px">${Dash.escapeHtml(me.full_name)}</div>
      <div class="dash-muted" style="font-size:13px">${Dash.escapeHtml(me.email)}</div>
      ${me.phone ? `<div class="dash-muted" style="font-size:12.5px">${Dash.escapeHtml(me.phone)}</div>` : ''}
      <div style="margin-top:6px"><span class="status-pill status-progress">Admin</span></div>
    </div>
  `;

  const isLive = !!window.isLiveBackend;
  document.getElementById('backend-status').innerHTML = `
    <div class="dash-flex-between" style="margin-bottom:10px">
      <span class="dash-muted">Mode</span>
      <span class="status-pill ${isLive ? 'status-success' : 'status-warning'}">${isLive ? 'Live (Supabase)' : 'Demo mode'}</span>
    </div>
    <p style="font-size:13px;line-height:1.7;color:var(--muted)">
      ${isLive
        ? 'Connected to Supabase — all reads and writes on this panel affect the live database.'
        : 'Running on localStorage-backed dummy data. Configure <code>assets/js/supabase-config.js</code> with your Supabase URL and anon key to go live.'}
    </p>
  `;
});
</script>
