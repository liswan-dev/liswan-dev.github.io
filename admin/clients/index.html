<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem('liswan-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clients — Admin — Liswan.dev</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#032E66">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body class="dash-body">
<div class="dash-sidebar-backdrop" data-sidebar-backdrop></div>
<div class="dash-shell">
  <aside class="dash-sidebar"></aside>
  <div>
    <header class="dash-topbar">
      <button class="dash-hamburger" data-sidebar-toggle aria-label="Toggle menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="dash-breadcrumb"><a href="/admin/invoices/">Invoice</a><span>/</span><span>Klien</span></div>
      <div class="dash-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="Search clients..."></div>
      <div class="dash-topbar-actions">
        <button class="dash-icon-btn" id="theme-toggle" aria-label="Toggle theme"></button>
        <button class="dash-icon-btn" id="notif-bell" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dash-notif-dot" id="notif-dot" hidden></span></button>
        <div class="dash-dropdown" id="notif-dropdown"></div>
        <button class="dash-profile-btn" id="profile-btn"><span class="dash-avatar" id="profile-avatar"></span><span id="profile-name"></span></button>
        <div class="dash-dropdown" id="profile-dropdown">
          <div class="dash-dropdown-head"><strong id="profile-name-2"></strong><span id="profile-email"></span></div>
          <a href="/admin/settings/" class="dash-dropdown-item">Settings</a>
          <button type="button" class="dash-dropdown-item" id="logout-btn">Log out</button>
        </div>
      </div>
    </header>
    <main class="dash-main">
      <div class="dash-page-head dash-flex-between">
        <div>
          <h1>Klien</h1>
          <p>Muncul di bagian &ldquo;Ditagihkan kepada&rdquo; pada invoice. Klik baris untuk detail.</p>
        </div>
        <button class="btn btn-primary" id="new-client-btn">+ Tambah Klien</button>
      </div>

      <div class="dash-table-wrap">
        <div class="dash-table-scroll">
          <table class="dash-table">
            <thead>
              <tr><th>Klien</th><th>Kontak</th><th>Invoice</th></tr>
            </thead>
            <tbody id="clients-tbody">
              <tr><td colspan="3"><div class="skeleton" style="height:20px"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modal-new-client">
  <div class="modal-box">
    <div class="modal-header"><h3>Tambah Klien</h3><button class="modal-close" data-modal-close="modal-new-client">&times;</button></div>
    <form id="new-client-form">
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-field">
            <label class="form-label" for="f-company">Nama perusahaan</label>
            <input type="text" id="f-company" class="form-input" required>
          </div>
          <div class="form-field">
            <label class="form-label" for="f-contact">Kontak</label>
            <input type="text" id="f-contact" class="form-input" required>
          </div>
          <div class="form-grid cols-2">
            <div class="form-field">
              <label class="form-label" for="f-email">Email</label>
              <input type="email" id="f-email" class="form-input" required>
            </div>
            <div class="form-field">
              <label class="form-label" for="f-whatsapp">WhatsApp</label>
              <input type="text" id="f-whatsapp" class="form-input" placeholder="+62 8xx-xxxx-xxxx">
            </div>
          </div>
          <div class="form-field">
            <label class="form-label" for="f-address">Alamat</label>
            <textarea id="f-address" class="form-textarea" style="min-height:70px"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-modal-close="modal-new-client">Batal</button>
        <button type="submit" class="btn btn-primary">Simpan</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="modal-client">
  <div class="modal-box" style="width:min(460px,100%)">
    <div class="modal-header"><h3 id="cl-title">Klien</h3><button class="modal-close" data-modal-close="modal-client">&times;</button></div>
    <div class="modal-body"><div class="kv" id="cl-body"></div></div>
    <div class="modal-footer"><a class="btn btn-primary" id="cl-invoice" href="/admin/invoices/new/">Buat Invoice</a></div>
  </div>
</div>

<div class="toast-stack" id="toast-stack"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-config.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/dummy-data.js"></script>
<script src="/assets/js/data-layer.js"></script>
<script src="/assets/js/dashboard.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const session = Dash.initShell({role:'admin'});
  if (!session) return;

  let clients = [];
  let projects = [];

  async function renderClients() {
    clients = await DB.listClients();
    projects = await DB.listAllProjects();
    const tbody = document.getElementById('clients-tbody');
    const invoices = await DB.listAllInvoices();
    if (!clients.length) {
      tbody.innerHTML = '<tr><td colspan="3"><div class="empty-state"><strong>Belum ada klien</strong></div></td></tr>';
      return;
    }
    const esc = Dash.escapeHtml;
    const invOf = c => { const ids = projects.filter(p => p.client_id === c.id).map(p => p.id); return invoices.filter(i => ids.includes(i.project_id)); };
    tbody.innerHTML = clients.map(c => `<tr class="row-click" data-search-row data-client="${c.id}">
        <td><strong>${esc(c.company_name)}</strong></td>
        <td class="dash-muted">${esc(c.contact_person || '-')}</td>
        <td>${invOf(c).length}</td>
      </tr>`).join('');
    tbody.querySelectorAll('[data-client]').forEach(r => r.addEventListener('click', () => {
      const c = clients.find(x => x.id === r.getAttribute('data-client'));
      const outstanding = invOf(c).reduce((s, i) => s + Math.max(0, (Number(i.total_amount) || 0) - (Number(i.paid_amount) || 0)), 0);
      const row = (k, v) => v ? `<div><span>${k}</span><strong>${esc(v)}</strong></div>` : '';
      document.getElementById('cl-title').textContent = c.company_name;
      document.getElementById('cl-body').innerHTML = row('Kontak', c.contact_person) + row('Email', c.email) + row('WhatsApp', c.whatsapp) +
        row('Alamat', c.address) + `<div><span>Belum terbayar</span><span class="big">${Dash.formatCurrency(outstanding)}</span></div>`;
      Dash.openModal('modal-client');
    }));
  }

  document.getElementById('new-client-btn').addEventListener('click', () => Dash.openModal('modal-new-client'));

  document.getElementById('new-client-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      company_name: document.getElementById('f-company').value.trim(),
      contact_person: document.getElementById('f-contact').value.trim(),
      email: document.getElementById('f-email').value.trim(),
      whatsapp: document.getElementById('f-whatsapp').value.trim(),
      address: document.getElementById('f-address').value.trim()
    };
    await DB.createClient(payload);
    Dash.closeModal('modal-new-client');
    e.target.reset();
    Dash.toast('Klien ditambahkan', 'success');
    await renderClients();
  });

  await renderClients();
});
</script>
</body>
</html>
