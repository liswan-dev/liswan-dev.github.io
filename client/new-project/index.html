    <main class="dash-main">
      <div class="dash-page-head">
        <h1>New Project Request</h1>
        <p>Tell us about the project you'd like to start and we'll follow up.</p>
      </div>

      <div class="dash-card" style="max-width:720px">
        <form id="new-project-form">
          <div class="form-grid">
            <div class="form-field">
              <label class="form-label" for="np-type">Project Type</label>
              <select id="np-type" class="form-select" required>
                <option value="" disabled selected>Select a project type</option>
                <option>Company Website</option>
                <option>Internal System</option>
                <option>Inventory System</option>
                <option>Dashboard</option>
                <option>Automation</option>
                <option>IT Support</option>
                <option>Other</option>
              </select>
            </div>
            <div class="form-field">
              <label class="form-label" for="np-name">Project Name</label>
              <input type="text" id="np-name" class="form-input" placeholder="e.g. Company Website Redesign" required>
            </div>
            <div class="form-field">
              <label class="form-label" for="np-desc">Description</label>
              <textarea id="np-desc" class="form-textarea" placeholder="Describe what you need..." required></textarea>
            </div>
            <div class="form-grid cols-2">
              <div class="form-field">
                <label class="form-label" for="np-budget">Budget Range</label>
                <select id="np-budget" class="form-select" required>
                  <option value="" disabled selected>Select a budget range</option>
                  <option>Rp 5.000.000 - Rp 10.000.000</option>
                  <option>Rp 10.000.000 - Rp 20.000.000</option>
                  <option>Rp 20.000.000 - Rp 35.000.000</option>
                  <option>Rp 35.000.000+</option>
                </select>
              </div>
              <div class="form-field">
                <label class="form-label" for="np-date">Target Date</label>
                <input type="date" id="np-date" class="form-input">
              </div>
            </div>
            <div class="form-field">
              <label class="form-label" for="np-file">Attachments (optional)</label>
              <input type="file" id="np-file" class="form-input" multiple>
              <span class="form-hint">Reference files, briefs, or existing brand assets.</span>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" style="margin-top:22px">Submit New Project</button>
        </form>
      </div>
    </main>
  </div>

<div class="toast-stack" id="toast-stack"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-config.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/dummy-data.js"></script>
<script src="/assets/js/data-layer.js"></script>
<script src="/assets/js/dashboard.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const session = Dash.initShell({role:'client'});
  if (!session) return;
  const n2 = document.getElementById('profile-name-2'); if (n2) n2.textContent = session.fullName;

  const form = document.getElementById('new-project-form');
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const type = document.getElementById('np-type').value;
    const name = document.getElementById('np-name').value.trim();
    const description = document.getElementById('np-desc').value.trim();
    const budgetRange = document.getElementById('np-budget').value;
    const targetDate = document.getElementById('np-date').value || null;
    const client = await DB.getMyClient();

    await DB.submitProjectRequest({
      project_type: type, complexity: null, features: [], company_name: client ? client.company_name : null,
      contact_person: session.fullName, email: session.email, whatsapp: null,
      description: (name ? name + ' — ' : '') + description, target_date: targetDate, budget_range: budgetRange,
      estimated_dev_time: null, recommended_tech: null
    });

    Dash.toast('Request submitted — we will follow up shortly.', 'success');
    form.reset();
  });
});
</script>
