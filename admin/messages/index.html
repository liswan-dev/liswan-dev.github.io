<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem('liswan-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Messages — Admin — Liswan.dev</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#032E66">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body class="dash-body">
<div class="dash-sidebar-backdrop" data-sidebar-backdrop></div>
<div class="dash-shell">
  <aside class="dash-sidebar"></aside>
  <div>
    <header class="dash-topbar">
      <button class="dash-hamburger" data-sidebar-toggle aria-label="Toggle menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="dash-breadcrumb"><a href="/admin/">Admin</a><span>/</span><span>Messages</span></div>
      <div class="dash-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="Search messages..."></div>
      <div class="dash-topbar-actions">
        <button class="dash-icon-btn" id="theme-toggle" aria-label="Toggle theme"></button>
        <button class="dash-icon-btn" id="notif-bell" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dash-notif-dot" id="notif-dot" hidden></span></button>
        <div class="dash-dropdown" id="notif-dropdown"></div>
        <button class="dash-profile-btn" id="profile-btn"><span class="dash-avatar" id="profile-avatar"></span><span id="profile-name"></span></button>
        <div class="dash-dropdown" id="profile-dropdown">
          <div class="dash-dropdown-head"><strong id="profile-name-2"></strong><span id="profile-email"></span></div>
          <a href="/admin/settings/" class="dash-dropdown-item">Settings</a>
          <button type="button" class="dash-dropdown-item" id="logout-btn">Log out</button>
        </div>
      </div>
    </header>
    <main class="dash-main">
      <div class="dash-page-head">
        <h1>Messages</h1>
        <p>Every project's discussion thread in one place. Reply inline — no need to open the project separately.</p>
      </div>

      <div id="messages-list">
        <div class="skeleton" style="height:200px"></div>
      </div>
    </main>
  </div>
</div>

<div class="toast-stack" id="toast-stack"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-config.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/dummy-data.js"></script>
<script src="/assets/js/data-layer.js"></script>
<script src="/assets/js/dashboard.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const session = Dash.initShell({role:'admin'});
  if (!session) return;

  const projects = await DB.listAllProjects();
  const container = document.getElementById('messages-list');

  if (!projects.length) {
    container.innerHTML = '<div class="dash-card"><div class="empty-state"><strong>No projects yet</strong><p>Create a project first to start a conversation.</p></div></div>';
    return;
  }

  async function renderThread(projectId) {
    const wrap = document.querySelector(`.js-thread[data-project-id="${projectId}"]`);
    const messages = await DB.listProjectMessages(projectId);
    wrap.innerHTML = messages.length
      ? '<div class="thread-list">' + messages.map(m => `
          <div class="thread-item role-${m.sender_role}">
            <div class="thread-head">
              <span class="thread-role">${m.sender_role === 'admin' ? 'You (Admin)' : Dash.escapeHtml(m.sender_name || 'Client')}</span>
              <span class="thread-time">${Dash.formatDate(m.created_at, {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
            </div>
            <div class="thread-body">${Dash.escapeHtml(m.message)}</div>
          </div>
        `).join('') + '</div>'
      : '<div class="empty-state" style="padding:28px"><p>No messages yet on this project.</p></div>';
  }

  container.innerHTML = projects.map(p => `
    <div class="dash-card" style="margin-bottom:18px">
      <div class="dash-flex-between" style="margin-bottom:14px">
        <div class="dash-section-title" style="margin-bottom:0">${Dash.escapeHtml(p.name)}</div>
        <span class="dash-muted" style="font-size:12px" id="count-${p.id}"></span>
      </div>
      <div class="js-thread" data-project-id="${p.id}"><div class="skeleton" style="height:60px"></div></div>
      <form class="js-reply-form" data-project-id="${p.id}" style="display:flex;gap:10px;margin-top:14px">
        <input type="text" class="form-input js-reply-input" placeholder="Write a reply..." required>
        <button type="submit" class="btn btn-primary" style="white-space:nowrap">Send</button>
      </form>
    </div>
  `).join('');

  for (const p of projects) {
    await renderThread(p.id);
    const messages = await DB.listProjectMessages(p.id);
    const countEl = document.getElementById('count-' + p.id);
    if (countEl) {
      countEl.textContent = messages.length + ' message' + (messages.length === 1 ? '' : 's');
      if (messages.length) {
        const last = messages[messages.length - 1];
        countEl.title = last.message;
      }
    }
  }

  container.querySelectorAll('.js-reply-form').forEach(form => {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const projectId = form.getAttribute('data-project-id');
      const input = form.querySelector('.js-reply-input');
      const text = input.value.trim();
      if (!text) return;
      await DB.sendMessage(projectId, text);
      input.value = '';
      await renderThread(projectId);
      const messages = await DB.listProjectMessages(projectId);
      document.getElementById('count-' + projectId).textContent = messages.length + ' message' + (messages.length === 1 ? '' : 's');
      Dash.toast('Reply sent', 'success');
    });
  });
});
</script>
</body>
</html>
