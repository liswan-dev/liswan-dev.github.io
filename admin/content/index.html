<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem('liswan-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Konten: Beranda — Admin — Liswan.dev</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#032E66">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
  <style>
    .repeater{display:grid;gap:14px}
    .repeater-item{border:1px solid var(--border);border-radius:14px;padding:16px;background:var(--surface-tint,rgba(0,0,0,.015));position:relative}
    .repeater-item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .repeater-item-head strong{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted2)}
    .btn-remove{border:1px solid var(--border-h);background:transparent;color:#c2453f;font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:8px;cursor:pointer}
    .btn-remove:hover{background:rgba(194,69,63,.08);border-color:#c2453f}
    .btn-add{border:1px dashed var(--border-h);background:transparent;color:var(--navy);font-size:12.5px;font-weight:700;padding:10px 14px;border-radius:10px;cursor:pointer;width:100%}
    .btn-add:hover{background:rgba(3,46,102,.05)}
    .chips-row{display:flex;flex-wrap:wrap;gap:8px}
    .chip-input{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-h);border-radius:999px;padding:4px 6px 4px 12px;background:var(--card)}
    .chip-input input{border:0;outline:0;background:transparent;font-size:12.5px;width:110px;font-family:inherit;color:var(--text)}
    .chip-input button{border:0;background:transparent;color:var(--muted2);cursor:pointer;font-size:13px;padding:2px 6px}
    .save-bar{position:sticky;bottom:16px;margin-top:40px;padding:16px 20px;border-radius:16px;border:1px solid var(--border);background:var(--card);box-shadow:0 -8px 30px rgba(20,30,50,.08);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .gh-dot{width:8px;height:8px;border-radius:50%;background:#c2453f;display:inline-block;vertical-align:middle}
    .gh-dot.ok{background:#2f9e5b}
    .save-status{flex-direction:row;align-items:center}
    .save-status .form-label{margin:0;display:flex;align-items:center;font-size:13px;color:var(--muted)}
  </style>
</head>
<body class="dash-body">
<div class="dash-sidebar-backdrop" data-sidebar-backdrop></div>
<div class="dash-shell">
  <aside class="dash-sidebar"></aside>
  <div>
    <header class="dash-topbar">
      <button class="dash-hamburger" data-sidebar-toggle aria-label="Toggle menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="dash-breadcrumb"><a href="/admin/content/">Edit Konten</a><span>/</span><span>Beranda</span></div>
      <div class="dash-topbar-actions">
        <button class="dash-icon-btn" id="theme-toggle" aria-label="Toggle theme"></button>
        <button class="dash-icon-btn" id="notif-bell" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dash-notif-dot" id="notif-dot" hidden></span></button>
        <div class="dash-dropdown" id="notif-dropdown"></div>
        <button class="dash-profile-btn" id="profile-btn"><span class="dash-avatar" id="profile-avatar"></span><span id="profile-name"></span></button>
        <div class="dash-dropdown" id="profile-dropdown">
          <div class="dash-dropdown-head"><strong id="profile-name-2"></strong><span id="profile-email"></span></div>
          <a href="/admin/settings/" class="dash-dropdown-item">Settings</a>
          <button type="button" class="dash-dropdown-item" id="logout-btn">Log out</button>
        </div>
      </div>
    </header>
    <main class="dash-main">
      <div class="dash-page-head dash-flex-between">
        <div>
          <h1>Beranda</h1>
          <p>Ubah teks, layanan, portofolio, dan harga di beranda tanpa edit HTML.</p>
        </div>
        <a href="/" target="_blank" class="btn-icon-text">Buka &#8599;</a>
      </div>

      <div class="dash-tabs">
        <button class="dash-tab active" data-tab-target="hero">Hero</button>
        <button class="dash-tab" data-tab-target="stats">Statistik</button>
        <button class="dash-tab" data-tab-target="about">Tentang</button>
        <button class="dash-tab" data-tab-target="services">Layanan</button>
        <button class="dash-tab" data-tab-target="portfolio">Portofolio</button>
        <button class="dash-tab" data-tab-target="process">Proses</button>
        <button class="dash-tab" data-tab-target="pricing">Harga</button>
        <button class="dash-tab" data-tab-target="contact">Kontak</button>
      </div>

      <div id="form-root">
        <div class="dash-tab-panel active" data-tab-panel="hero"><div class="dash-card"><div class="skeleton" style="height:160px"></div></div></div>
        <div class="dash-tab-panel" data-tab-panel="stats"></div>
        <div class="dash-tab-panel" data-tab-panel="about"></div>
        <div class="dash-tab-panel" data-tab-panel="services"></div>
        <div class="dash-tab-panel" data-tab-panel="portfolio"></div>
        <div class="dash-tab-panel" data-tab-panel="process"></div>
        <div class="dash-tab-panel" data-tab-panel="pricing"></div>
        <div class="dash-tab-panel" data-tab-panel="contact"></div>
      </div>

      <div class="save-bar">
        <div class="form-field save-status">
          <span class="form-label"><span class="gh-dot" id="gh-dot"></span>&nbsp; <span id="gh-label">Belum terhubung</span></span>
          <div class="form-hint" id="save-note"></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <button type="button" class="btn-icon-text" id="btn-more">Lainnya</button>
          <button class="btn btn-primary" id="btn-publish">Simpan</button>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="modal-overlay" id="modal-more">
  <div class="modal-box" style="max-width:380px">
    <div class="modal-header"><h3>Lainnya</h3><button class="modal-close" data-modal-close="modal-more">&times;</button></div>
    <div class="modal-body" style="display:grid;gap:10px">
      <button class="btn btn-secondary" id="btn-gh">Koneksi GitHub</button>
      <button class="btn btn-secondary" id="btn-reload">Muat Ulang</button>
      <button class="btn btn-secondary" id="btn-download">Unduh content.json</button>
    </div>
  </div>
</div>
<div class="toast-stack" id="toast-stack"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-config.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/dummy-data.js"></script>
<script src="/assets/js/data-layer.js"></script>
<script src="/assets/js/dashboard.js"></script>
<script src="/assets/js/publish-config.js"></script>
<script src="/assets/js/github-publish.js"></script>
<script src="/assets/js/content-admin.js"></script>
</body>
</html>
