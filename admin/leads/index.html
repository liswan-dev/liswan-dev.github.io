<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem('liswan-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leads — Admin — Liswan.dev</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#032E66">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body class="dash-body">
<div class="dash-sidebar-backdrop" data-sidebar-backdrop></div>
<div class="dash-shell">
  <aside class="dash-sidebar"></aside>
  <div>
    <header class="dash-topbar">
      <button class="dash-hamburger" data-sidebar-toggle aria-label="Toggle menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="dash-breadcrumb"><a href="/admin/">Admin</a><span>/</span><span>Leads</span></div>
      <div class="dash-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="Search leads..."></div>
      <div class="dash-topbar-actions">
        <button class="dash-icon-btn" id="theme-toggle" aria-label="Toggle theme"></button>
        <button class="dash-icon-btn" id="notif-bell" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dash-notif-dot" id="notif-dot" hidden></span></button>
        <div class="dash-dropdown" id="notif-dropdown"></div>
        <button class="dash-profile-btn" id="profile-btn"><span class="dash-avatar" id="profile-avatar"></span><span id="profile-name"></span></button>
        <div class="dash-dropdown" id="profile-dropdown">
          <div class="dash-dropdown-head"><strong id="profile-name-2"></strong><span id="profile-email"></span></div>
          <a href="/admin/settings/" class="dash-dropdown-item">Settings</a>
          <button type="button" class="dash-dropdown-item" id="logout-btn">Log out</button>
        </div>
      </div>
    </header>
    <main class="dash-main">
      <div class="dash-page-head">
        <h1>Leads</h1>
        <p>Submissions from the public Start-a-Project builder and clients' New Project requests.</p>
      </div>

      <div class="dash-table-wrap">
        <div class="dash-table-scroll">
          <table class="dash-table">
            <thead>
              <tr><th>Company / Contact</th><th>Project Type</th><th>Complexity</th><th>Budget Range</th><th>Submitted</th><th>Source</th><th>Status</th><th></th></tr>
            </thead>
            <tbody id="leads-tbody">
              <tr><td colspan="8"><div class="skeleton" style="height:20px"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modal-lead-detail">
  <div class="modal-box">
    <div class="modal-header"><h3 id="lead-detail-title">Lead Detail</h3><button class="modal-close" data-modal-close="modal-lead-detail">&times;</button></div>
    <div class="modal-body" id="lead-detail-body"></div>
  </div>
</div>

<div class="toast-stack" id="toast-stack"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-config.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/dummy-data.js"></script>
<script src="/assets/js/data-layer.js"></script>
<script src="/assets/js/dashboard.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const session = Dash.initShell({role:'admin'});
  if (!session) return;

  const STATUS_OPTIONS = ['new','contacted','converted','declined'];
  const STATUS_PILL = { new: 'status-info', contacted: 'status-warning', converted: 'status-success', declined: 'status-danger' };

  let leads = [];

  async function renderLeads() {
    leads = await DB.listLeads();
    const tbody = document.getElementById('leads-tbody');
    if (!leads.length) {
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><strong>No leads yet</strong><p>Submissions from the Start-a-Project builder will appear here.</p></div></td></tr>';
      return;
    }
    tbody.innerHTML = leads.map(l => `<tr data-search-row>
      <td><strong>${Dash.escapeHtml(l.company_name || '-')}</strong><br><span class="dash-muted" style="font-size:12px">${Dash.escapeHtml(l.contact_person || '')}</span></td>
      <td>${Dash.escapeHtml(l.project_type || '-')}</td>
      <td>${Dash.escapeHtml(l.complexity || '-')}</td>
      <td>${Dash.escapeHtml(l.budget_range || '-')}</td>
      <td>${Dash.formatDate(l.created_at)}</td>
      <td>${l.client_id ? '<span class="status-pill status-neutral">Existing client</span>' : '<span class="status-pill status-info">Public inquiry</span>'}</td>
      <td>
        <select class="form-select js-lead-status" data-lead-id="${l.id}" style="padding:7px 10px;font-size:12.5px">
          ${STATUS_OPTIONS.map(s => `<option value="${s}" ${s === l.status ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </td>
      <td><button type="button" class="btn btn-secondary js-view-lead" data-lead-id="${l.id}" style="padding:8px 14px;font-size:12px">View</button></td>
    </tr>`).join('');

    tbody.querySelectorAll('.js-lead-status').forEach(sel => {
      sel.addEventListener('change', async () => {
        await DB.updateLeadStatus(sel.getAttribute('data-lead-id'), sel.value);
        Dash.toast('Lead status updated', 'success');
      });
    });
    tbody.querySelectorAll('.js-view-lead').forEach(btn => {
      btn.addEventListener('click', () => viewLead(btn.getAttribute('data-lead-id')));
    });
  }

  function viewLead(leadId) {
    const l = leads.find(x => x.id === leadId);
    if (!l) return;
    document.getElementById('lead-detail-title').textContent = l.company_name || 'Lead Detail';
    const features = Array.isArray(l.features) ? l.features : [];
    document.getElementById('lead-detail-body').innerHTML = `
      <div class="form-grid">
        <div class="form-field"><span class="form-label">Contact</span><span>${Dash.escapeHtml(l.contact_person || '-')} &middot; ${Dash.escapeHtml(l.email || '-')} &middot; ${Dash.escapeHtml(l.whatsapp || '-')}</span></div>
        <div class="form-field"><span class="form-label">Description</span><span>${Dash.escapeHtml(l.description || '-')}</span></div>
        <div class="form-field">
          <span class="form-label">Features</span>
          <div>${features.length ? features.map(f => `<span class="status-pill status-neutral" style="margin:2px 4px 2px 0">${Dash.escapeHtml(f)}</span>`).join('') : '<span class="dash-muted">None specified</span>'}</div>
        </div>
        <div class="form-grid cols-2">
          <div class="form-field"><span class="form-label">Estimated Dev Time</span><span>${Dash.escapeHtml(l.estimated_dev_time || '-')}</span></div>
          <div class="form-field"><span class="form-label">Recommended Tech</span><span>${Dash.escapeHtml(l.recommended_tech || '-')}</span></div>
        </div>
        <div class="form-grid cols-2">
          <div class="form-field"><span class="form-label">Target Date</span><span>${l.target_date ? Dash.formatDate(l.target_date) : '-'}</span></div>
          <div class="form-field"><span class="form-label">Budget Range</span><span>${Dash.escapeHtml(l.budget_range || '-')}</span></div>
        </div>
      </div>
    `;
    Dash.openModal('modal-lead-detail');
  }

  await renderLeads();
});
</script>
</body>
</html>
