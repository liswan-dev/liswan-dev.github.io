<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem('liswan-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Semua Invoice — Admin — Liswan.dev</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#032E66">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body class="dash-body">
<div class="dash-sidebar-backdrop" data-sidebar-backdrop></div>
<div class="dash-shell">
  <aside class="dash-sidebar"></aside>
  <div>
    <header class="dash-topbar">
      <button class="dash-hamburger" data-sidebar-toggle aria-label="Toggle menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="dash-breadcrumb"><a href="/admin/invoices/">Invoice</a><span>/</span><span>Semua Invoice</span></div>
      <div class="dash-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="Cari invoice..."></div>
      <div class="dash-topbar-actions">
        <button class="dash-icon-btn" id="theme-toggle" aria-label="Toggle theme"></button>
        <button class="dash-icon-btn" id="notif-bell" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dash-notif-dot" id="notif-dot" hidden></span></button>
        <div class="dash-dropdown" id="notif-dropdown"></div>
        <button class="dash-profile-btn" id="profile-btn"><span class="dash-avatar" id="profile-avatar"></span><span id="profile-name"></span></button>
        <div class="dash-dropdown" id="profile-dropdown">
          <div class="dash-dropdown-head"><strong id="profile-name-2"></strong><span id="profile-email"></span></div>
          <a href="/admin/settings/" class="dash-dropdown-item">Settings</a>
          <button type="button" class="dash-dropdown-item" id="logout-btn">Log out</button>
        </div>
      </div>
    </header>
    <main class="dash-main">
      <div class="dash-page-head dash-flex-between">
        <div>
          <h1>Semua Invoice</h1>
          <p>Klik baris untuk melihat detail, mencetak, atau mencatat pembayaran.</p>
        </div>
        <a class="btn btn-primary" href="/admin/invoices/new/">+ Buat Invoice</a>
      </div>

      <div class="dash-grid cols-3" id="inv-stats" style="margin-bottom:48px">
        <div class="dash-card"><div class="skeleton" style="height:48px"></div></div>
        <div class="dash-card"><div class="skeleton" style="height:48px"></div></div>
        <div class="dash-card"><div class="skeleton" style="height:48px"></div></div>
      </div>

      <div class="dash-tabs" id="inv-filter">
        <button type="button" class="dash-tab active" data-filter="all">Semua</button>
        <button type="button" class="dash-tab" data-filter="open">Belum lunas</button>
        <button type="button" class="dash-tab" data-filter="overdue">Jatuh tempo</button>
        <button type="button" class="dash-tab" data-filter="paid">Lunas</button>
      </div>

      <div class="dash-table-wrap">
        <div class="dash-table-scroll">
          <table class="dash-table">
            <thead>
              <tr><th>Invoice</th><th>Klien</th><th>Jatuh tempo</th><th>Sisa</th><th>Status</th></tr>
            </thead>
            <tbody id="invoices-tbody">
              <tr><td colspan="5"><div class="skeleton" style="height:20px"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modal-view-invoice">
  <div class="modal-box" style="width:min(520px,100%)">
    <div class="modal-header"><h3 id="view-invoice-title">Invoice</h3><button class="modal-close" data-modal-close="modal-view-invoice">&times;</button></div>
    <div class="modal-body" id="view-invoice-body"></div>
    <div class="modal-footer" style="justify-content:space-between;flex-wrap:wrap">
      <button type="button" class="btn-icon-text danger" id="delete-invoice-btn">Hapus</button>
      <div class="pop-actions">
        <a class="btn-icon-text" id="wa-invoice-btn" target="_blank" rel="noopener">WhatsApp</a>
        <a class="btn btn-secondary" id="pay-invoice-btn">Bayar</a>
        <button type="button" class="btn btn-primary" id="print-invoice-btn">Cetak</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-stack" id="toast-stack"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-config.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/dummy-data.js"></script>
<script src="/assets/js/data-layer.js"></script>
<script src="/assets/js/dashboard.js"></script>
<script src="/assets/js/invoice-lib.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const session = Dash.initShell({ role: 'admin' });
  if (!session) return;
  const esc = Dash.escapeHtml, cur = Dash.formatCurrency;
  let data = { invoices: [] }, filter = 'all', current = null;

  function renderStats() {
    const inv = data.invoices, month = INV.today().slice(0, 7);
    const overdue = inv.filter(i => INV.statusOf(i) === 'overdue');
    const card = (label, value) => `<div class="dash-card"><div class="dash-stat-label">${label}</div><div class="dash-stat-value">${value}</div></div>`;
    DB.listPayments().then(pays => {
      const received = pays.filter(p => String(p.paid_at).slice(0, 7) === month).reduce((s, p) => s + (Number(p.amount) || 0), 0);
      document.getElementById('inv-stats').innerHTML =
        card('Belum terbayar', cur(inv.reduce((s, i) => s + INV.balance(i), 0))) +
        card('Jatuh tempo', cur(overdue.reduce((s, i) => s + INV.balance(i), 0))) +
        card('Diterima bulan ini', cur(received));
    });
  }

  function renderTable() {
    const match = i => filter === 'all' || (filter === 'open' ? INV.balance(i) > 0 : INV.statusOf(i) === filter);
    const rows = data.invoices.filter(match);
    const tbody = document.getElementById('invoices-tbody');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><strong>Belum ada invoice</strong></div></td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(i => `<tr class="row-click" data-search-row data-view="${i.id}">
      <td><strong>${esc(i.invoice_number)}</strong></td>
      <td>${esc(i._client ? i._client.company_name : '-')}</td>
      <td class="dash-muted">${Dash.formatDate(i.due_date)}</td>
      <td>${cur(INV.balance(i))}</td>
      <td>${INV.pill(i)}</td>
    </tr>`).join('');
    tbody.querySelectorAll('[data-view]').forEach(r => r.addEventListener('click', () => view(r.getAttribute('data-view'))));
  }

  async function view(id) {
    const inv = data.invoices.find(i => i.id === id);
    const [items, pays] = await Promise.all([DB.listInvoiceItems(id), DB.listPayments(id)]);
    current = { inv, items, pays };
    const t = INV.totals(items.length ? items : [{ qty: 1, unit_price: inv.total_amount }], inv.tax_percent, inv.discount_amount);
    document.getElementById('view-invoice-title').innerHTML = esc(inv.invoice_number) + ' &nbsp;' + INV.pill(inv);
    const list = items.length ? items : [{ description: inv._project ? inv._project.name : 'Tagihan', qty: 1, unit_price: inv.total_amount }];
    document.getElementById('view-invoice-body').innerHTML = `
      <div class="kv">
        <div><span>Klien</span><strong>${esc(inv._client ? inv._client.company_name : '-')}</strong></div>
        <div><span>Jatuh tempo</span><strong>${Dash.formatDate(inv.due_date)}</strong></div>
      </div>
      <div class="kv" style="margin:26px 0;padding:22px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)">
        ${list.map(it => `<div><span>${esc(it.description)}${it.qty > 1 ? ' × ' + it.qty : ''}</span><span style="color:var(--text)">${cur(it.qty * it.unit_price)}</span></div>`).join('')}
        ${t.discount ? `<div><span>Diskon</span><span>− ${cur(t.discount)}</span></div>` : ''}
        ${Number(inv.tax_percent) ? `<div><span>Pajak ${inv.tax_percent}%</span><span>${cur(t.tax)}</span></div>` : ''}
      </div>
      <div class="kv">
        <div><span>Total</span><strong>${cur(inv.total_amount)}</strong></div>
        <div><span id="paid-label">Dibayar</span><span>${cur(inv.paid_amount)}</span></div>
        <div><span>Sisa</span><span class="big">${cur(INV.balance(inv))}</span></div>
      </div>`;
    if (pays.length) {
      const detail = document.createElement('span');
      detail.innerHTML = pays.map(p => Dash.formatDate(p.paid_at) + ' · ' + esc(p.method || '-') + ' · ' + cur(p.amount)).join('<br>');
      document.getElementById('paid-label').appendChild(Dash.infoButton(detail));
    }
    const payBtn = document.getElementById('pay-invoice-btn');
    payBtn.href = '/admin/invoices/payments/?invoice=' + encodeURIComponent(id);
    payBtn.style.display = INV.balance(inv) > 0 ? '' : 'none';
    const wa = document.getElementById('wa-invoice-btn');
    wa.href = INV.waLink(inv);
    wa.style.display = INV.balance(inv) > 0 ? '' : 'none';
    Dash.openModal('modal-view-invoice');
  }

  document.getElementById('print-invoice-btn').addEventListener('click', () => current && INV.print(current.inv, current.items, current.pays));
  document.getElementById('delete-invoice-btn').addEventListener('click', async () => {
    if (!current) return;
    if (!(await Dash.confirm('Hapus invoice ' + current.inv.invoice_number + ' beserta item & riwayat pembayarannya?', 'Hapus'))) return;
    await DB.deleteInvoice(current.inv.id);
    Dash.closeModal('modal-view-invoice');
    Dash.toast('Invoice dihapus', 'success');
    await load();
  });

  document.querySelectorAll('#inv-filter [data-filter]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('#inv-filter .dash-tab').forEach(x => x.classList.toggle('active', x === b));
    filter = b.getAttribute('data-filter');
    renderTable();
  }));

  async function load() { data = await INV.loadAll(); renderStats(); renderTable(); }
  await load();
  const openId = new URLSearchParams(location.search).get('open');
  if (openId && data.invoices.some(i => i.id === openId)) view(openId);
});
</script>
</body>
</html>
